server:
  port: 0
spring:
  output:
    ansi:
      enabled: ALWAYS
  # DataSource
  datasource:
    driver-class-name: ${USERS_POSTGRESQL_DRIVER:org.postgresql.Driver}
    url: ${USERS_POSTGRESQL_URL:jdbc:postgresql://localhost:5435/users}
    username: ${USERS_POSTGRESQL_USER:dbuserUsers}
    password: ${USERS_POSTGRESQL_PASSWORD:12345Users}
  # JPA
  jpa:
    hibernate:
      ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true
      dialect: org.hibernate.dialect.PostgreSQLDialect
logging:
  level:
    ru:
      practicum: INFO
    org:
      springframework:
        orm:
          jpa: INFO
          TransactionManager: DEBUG
          transaction: INFO
          transaction.interceptor: TRACE
      Zalando:
        logbook: TRACE